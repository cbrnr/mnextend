name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

jobs:
  check:
    name: Run checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.1.0
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "format --diff"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Check license headers
        run: python .github/check_license_headers.py
      - name: Get latest uv version
        id: uv-version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          LATEST=$(gh api repos/astral-sh/uv/releases/latest --jq '.tag_name' | sed 's/^v//')
          test -n "$LATEST"
          echo "version=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Latest uv version: $LATEST"
      - name: Check uv_build compatibility
        env:
          UV_LATEST_VERSION: ${{ steps.uv-version.outputs.version }}
        run: |
          pip install packaging
          python .github/check_uv_build.py

  test:
    needs: check
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        os: [ubuntu-24.04, macos-15, windows-2022]
    name: Run tests (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the project
        run: uv sync
      - name: Run tests
        run: uv run pytest -W error tests
